# Markdown for Agents — nginx cache-segmentation snippet
#
# WHY THIS EXISTS (read the README section "The cache layer caveat"):
# the advanced-cache.php page-cache drop-in serves cache HITs before any
# WordPress plugin loads. Without help, a request carrying
# `Accept: text/markdown` for an already-cached URL receives the cached HTML,
# and a drop-in that ignores DONOTCACHEPAGE could even store the Markdown
# body under the shared URL key and hand it to browsers.
#
# nginx cannot bypass a PHP-level drop-in directly, but it can change the
# REQUEST_URI that PHP (and therefore the drop-in, which keys its cache on
# $_SERVER['REQUEST_URI']) sees: Markdown-preferring requests get a marker
# query argument appended, giving them a distinct cache key. Most drop-ins
# refuse to cache query-string URLs entirely, which is also fine.
#
# This deliberately matches any header that *mentions* text/markdown; the
# precise RFC 9110 q-value comparison happens in PHP (AcceptParser). nginx
# only has to make sure such requests reach PHP. Browsers never send
# "text/markdown", so human traffic is completely unaffected.
#
# INSTALL (two steps, both required — verified against nginx 1.30 syntax):
#
# 1. Include this file in the `http { }` context (it only defines maps):
#        include /etc/nginx/snippets/markdown-agents.conf;
#
# 2. In the `location ~ \.php$` block that fronts WordPress, override the
#    REQUEST_URI param AFTER the usual `include fastcgi_params;` line:
#        fastcgi_param REQUEST_URI $bma_request_uri;
#
# Then `nginx -t && nginx -s reload`.

map $http_accept $bma_wants_markdown {
    default            0;
    "~*text/markdown"  1;
}

# $is_args is "?" when the original request already has a query string.
map "$bma_wants_markdown:$is_args" $bma_request_uri {
    default  $request_uri;
    "1:?"    "${request_uri}&bma_md=1";
    "1:"     "${request_uri}?bma_md=1";
}

# Markdown for Agents — /.well-known/ exemption
#
# WHY THIS EXISTS: hardened nginx configs commonly deny all dotfile paths
# with something like:
#
#     location ~ /\. { deny all; }
#
# That rule also 403s /.well-known/… — which is exactly what the
# isitagentready.com scan reported for the MCP server card and the agent
# skills index. The discovery documents served by this plugin
# (/.well-known/oauth-protected-resource, /.well-known/oauth-authorization-server,
# /.well-known/mcp/server-card.json, /.well-known/agent-skills/…) are
# virtual WordPress routes, so requests must reach PHP.
#
# INSTALL: include this file inside the `server { }` block BEFORE any
# `location ~ /\.` deny rule (an exact-prefix ^~ location wins over regex
# locations regardless of order, but keeping it first makes intent obvious):
#
#     include /etc/nginx/snippets/well-known.conf;
#
# Then `nginx -t && nginx -s reload`.
#
# ACME clients (certbot & co.) sometimes write real files under
# /.well-known/acme-challenge/ — try_files serves those directly and only
# falls back to WordPress when no file exists.

location ^~ /.well-known/ {
    try_files $uri $uri/ /index.php?$args;
}
